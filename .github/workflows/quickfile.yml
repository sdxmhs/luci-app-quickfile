name: Build IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext zlib1g-dev libsqlite3-dev wget

      - name: Download SDK and Compile
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mkdir sdk
          tar -xJf openwrt-sdk-*.tar.xz --strip-components=1 -C sdk
          cd sdk
          
          ./scripts/feeds update -a
          rm -rf feeds/telephony
          ./scripts/feeds install -a || ./scripts/feeds install -a || ./scripts/feeds install -a
          
          # 【已修正】使用 wget 下载 main 分支源码，一次性解压出两个所需目录
          wget -qO- https://github.com/sbwml/luci-app-quickfile/archive/refs/heads/main.tar.gz | tar -xz
          
          # GitHub 打包的压缩包解压后默认带有 "仓库名-分支名" 的外层文件夹
          # 将解压出来的两个组件目录移动到 package 中
          mv luci-app-quickfile-main/luci-app-quickfile package/
          mv luci-app-quickfile-main/quickfile package/
          
          # 清理掉多余的外层文件夹
          rm -rf luci-app-quickfile-main
          
          ./scripts/feeds install -a
          make package/luci-app-quickfile/compile V=s

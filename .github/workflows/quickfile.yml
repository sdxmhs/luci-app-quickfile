name: Build OpenWrt  # 工作流名称

on:
  workflow_dispatch:
    inputs:
      install_quickfile:
        description: '是否安装 Quickfile 插件'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04  # 或你的运行环境
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DIY Part 1
        if: github.event.inputs.install_quickfile == 'true'
        run: |
          chmod +x diy-part1.sh
          bash diy-part1.sh

      # 在这里运行 feeds 相关操作，系统会自动进入正确的源码目录
      - name: Update Feeds
        run: ./scripts/feeds update -a

      - name: Install Feeds
        run: ./scripts/feeds install -a

name: Build IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext zlib1g-dev libsqlite3-dev wget

      - name: Download SDK and Compile
        run: |
          wget https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mkdir sdk
          tar -xJf openwrt-sdk-*.tar.xz --strip-components=1 -C sdk
          cd sdk
          
          ./scripts/feeds update -a
          ./scripts/feeds install -a || ./scripts/feeds install -a || ./scripts/feeds install -a
          
          # 使用 wget 替换 git clone
          mkdir -p package/luci-app-quickfile
          mkdir -p package/quickfile
          wget -qO- https://github.com/sbwml/luci-app-quickfile/archive/refs/heads/master.tar.gz | tar -xz -C package/luci-app-quickfile --strip-components=1
          wget -qO- https://github.com/sbwml/quickfile/archive/refs/heads/master.tar.gz | tar -xz -C package/quickfile --strip-components=1
          
          ./scripts/feeds install -a
          make package/luci-app-quickfile/compile V=s

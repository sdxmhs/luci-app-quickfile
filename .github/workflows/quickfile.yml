name: Build OpenWrt  # 工作流名称

on:
  workflow_dispatch:
    inputs:
      install_quickfile:
        description: '是否安装 Quickfile 插件'
        required: false
        default: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04  # 或你的运行环境
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DIY Part 1
        if: github.event.inputs.install_quickfile == 'true'
        run: |
          chmod +x diy-part1.sh
          bash diy-part1.sh

      - name: Update Feeds
        # 假设你的 OpenWrt 源码放在 openwrt 目录下（请根据你的仓库实际情况调整）
        working-directory: openwrt  
        run: ./scripts/feeds update -a

      - name: Install Feeds
        working-directory: openwrt
        run: ./scripts/feeds install -a

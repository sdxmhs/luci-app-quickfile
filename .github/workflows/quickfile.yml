name: Build IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext zlib1g-dev libsqlite3-dev wget

      - name: Download SDK and Compile
        run: |
          # 1. 下载并解压 SDK
          wget https://downloads.openwrt.org/releases/23.05.3/targets/x86/64/openwrt-sdk-23.05.3-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          
          # 显式创建一个 sdk 目录并解压进去
          mkdir sdk
          tar -xJf openwrt-sdk-*.tar.xz --strip-components=1 -C sdk
          
          # 2. 进入 SDK 目录
          cd sdk

          # 3. 更新基础 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 4. 下载你的插件源码
          mkdir -p package/luci-app-quickfile
          git clone https://github.com/sbwml/luci-app-quickfile package/luci-app-quickfile
          git clone https://github.com/sbwml/quickfile package/quickfile

          # 5. 安装插件所需的依赖
          ./scripts/feeds install -a

          # 6. 编译插件
          make package/luci-app-quickfile/compile V=s

      - name: Compile Package
        run: |
          cd sdk
          # 添加插件到 package 目录
          git clone https://github.com/sbwml/luci-app-quickfile package/luci-app-quickfile
          git clone https://github.com/sbwml/quickfile package/quickfile
          
          # 生成配置文件
          make defconfig
          # 编译插件
          make package/luci-app-quickfile/compile V=s

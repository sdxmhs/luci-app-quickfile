name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # 新版 SDK 额外需要 zstd 等解压工具
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext zlib1g-dev libsqlite3-dev wget curl zstd

      - name: Download Snapshot SDK and Compile
        run: |
          # 【修复 1】使用 grep -oE 增加对 .zst 格式的正则匹配兼容
          SDK_FILE=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/sha256sums | grep -oE "openwrt-sdk-.*\.tar\.(xz|zst)" | head -n 1)
          
          # 打印一下获取到的文件名，方便在 Action 日志里排错
          echo "Found SDK file: $SDK_FILE"
          
          # 下载 SDK
          wget "https://downloads.openwrt.org/snapshots/targets/x86/64/$SDK_FILE"
          
          mkdir sdk
          # 【修复 2】将原本的 tar -xJf 改为 tar -xf（去掉强制 xz 解压的 J 参数，让 tar 自动根据文件头判断）
          tar -xf "$SDK_FILE" --strip-components=1 -C sdk
          cd sdk
          
          ./scripts/feeds update -a
          rm -rf feeds/telephony
          ./scripts/feeds install -a || ./scripts/feeds install -a
          
          wget -qO- https://github.com/sbwml/luci-app-quickfile/archive/refs/heads/main.tar.gz | tar -xz
          mv luci-app-quickfile-main/luci-app-quickfile package/
          mv luci-app-quickfile-main/quickfile package/
          rm -rf luci-app-quickfile-main
          
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-quickfile/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-quickfile-apk
          # 使用 **/*.apk 可以强迫 GitHub 递归扫描 bin 目录下的所有子文件夹，把所有生成的 apk 全抓出来
          path: sdk/bin/**/*.apk

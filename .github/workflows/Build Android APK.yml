name: Build APK and Release

on:
  workflow_dispatch:

# 【新增】赋予 GITHUB_TOKEN 写入仓库内容的权限，才能创建 Release
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext zlib1g-dev libsqlite3-dev wget curl zstd

      - name: Download Snapshot SDK and Compile
        run: |
          SDK_FILE=$(curl -s https://downloads.openwrt.org/snapshots/targets/x86/64/sha256sums | grep -oE "openwrt-sdk-.*\.tar\.(xz|zst)" | head -n 1)
          echo "Found SDK file: $SDK_FILE"
          
          wget "https://downloads.openwrt.org/snapshots/targets/x86/64/$SDK_FILE"
          
          mkdir sdk
          tar -xf "$SDK_FILE" --strip-components=1 -C sdk
          cd sdk
          
          ./scripts/feeds update -a
          rm -rf feeds/telephony
          ./scripts/feeds install -a || ./scripts/feeds install -a
          
          wget -qO- https://github.com/sbwml/luci-app-quickfile/archive/refs/heads/main.tar.gz | tar -xz
          mv luci-app-quickfile-main/luci-app-quickfile package/
          mv luci-app-quickfile-main/quickfile package/
          rm -rf luci-app-quickfile-main
          
          ./scripts/feeds install -a
          make defconfig
          make package/luci-app-quickfile/compile V=s

      - name: Organize Release Files
        run: |
          mkdir -p release_apks
          find sdk/bin/ -type f -name "luci-app-quickfile*.apk" -exec cp {} release_apks/ \;
          find sdk/bin/ -type f -name "luci-i18n-quickfile*.apk" -exec cp {} release_apks/ \;
          find sdk/bin/ -type f -name "quickfile*.apk" -exec cp {} release_apks/ \;

      # 使用插件自动创建 Release 并上传刚刚提取的文件
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "QuickFile 自动编译版 (Build ${{ github.run_number }})"
          body: "自动编译的 OpenWrt Snapshot APK 安装包。"
          files: release_apks/*.apk
